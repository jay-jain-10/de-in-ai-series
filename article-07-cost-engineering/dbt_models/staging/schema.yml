version: 2

sources:
  - name: raw
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'ANALYTICS') }}"
    schema: RAW
    tables:
      - name: cost_events
        description: "One row per Claude API call (retries and cache hits included)"
        columns:
          - name: pipeline_name
            tests: [not_null]
          - name: model
            tests: [not_null]
          - name: cost_usd
            tests: [not_null]
          - name: cost_tokens
            tests: [not_null]

models:
  - name: stg_cost_events
    columns:
      - name: cost_usd
        tests: [not_null]
